<html lang="en">

    <meta charset="UTF-8" />

    <title>Rienda: spending limits for AI agents</title>
    <meta name="description" content="Rienda is a contract on Monad that limits what your AI agent can pay. Small payments go through, big ones wait for you, and the rest are blocked and recorded onchain." />
    <meta name="theme-color" content="#ffffff" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Rienda" />
    <meta property="og:title" content="Rienda: spending limits for AI agents" />
    <meta property="og:description" content="Rienda is a contract on Monad that limits what your AI agent can pay. Small payments go through, big ones wait for you, and the rest are blocked and recorded onchain." />
    <meta property="og:url" content="https://rienda-production.up.railway.app/" />
    <meta property="og:image" content="https://rienda-production.up.railway.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Rienda: give your AI agent a spending limit it can't talk its way past." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Rienda: spending limits for AI agents" />
    <meta name="twitter:description" content="Rienda is a contract on Monad that limits what your AI agent can pay. Small payments go through, big ones wait for you, and the rest are blocked and recorded onchain." />
    <meta name="twitter:image" content="https://rienda-production.up.railway.app/og.png" />
  </head>
  <body>
    <script>
      (function () {
        var d = document.documentElement;
        if (!matchMedia("(prefers-reduced-motion: reduce)").matches) d.classList.add("motion");
        var b = navigator.userAgentData && navigator.userAgentData.brands;
        if (b && b.some(function (x) { return x.brand === "Chromium"; })) d.classList.add("liquid");
      })();
    </script>
    <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
      <filter id="liquid" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
        <feTurbulence type="fractalNoise" baseFrequency="0.006 0.01" numOctaves="2" seed="4" result="n" />
        <feGaussianBlur in="n" stdDeviation="3" result="nb" />
        <feDisplacementMap in="SourceGraphic" in2="nb" scale="12" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </svg>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
